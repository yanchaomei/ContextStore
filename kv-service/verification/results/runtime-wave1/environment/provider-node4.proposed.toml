# PROPOSAL ONLY: not deployed or started.
# Two listeners use one physical HCA. This is a multi-QP correctness setup.
[api]
listen = "10.0.0.64:25351"
max_connections = 100

[cluster]
node_id = "wave1-provider-node4"
grpc_advertise = "10.0.0.64:25351"
rdma_advertise = "10.0.0.64:25353"
data_nodes = []

[storage]
devices = ["/home/kvgroup/chaomei/contextstore_runtime_wave1_provider_20261029/data/stripe0", "/home/kvgroup/chaomei/contextstore_runtime_wave1_provider_20261029/data/stripe1"]
data_subdir = "contextstore"
striping_threshold = 4194304
striping_chunk_size = 4194304
rdma_stream_chunk_size = 1048576
verify_stripe_checksums = true

[memory_tier]
capacity_mb = 0
slab_size_mb = 4
use_pinned_memory = false

[io_executor]
kind = "tier_a"
thread_pool_size = 4
io_uring_depth = 32

[router]
strategy = "object_hash"

[metadata]
redis_url = "redis://127.0.0.1:26379/"
redis_key_prefix = "contextstore:wave1-provider-20261029:"
redis_connect_timeout_ms = 1000
redis_command_timeout_ms = 1000

[gc]
enabled = false
interval_seconds = 300
grace_seconds = 600
max_tasks_per_run = 1000
task_lease_seconds = 300

[metrics]
enabled = false
listen = "127.0.0.1:25390"
